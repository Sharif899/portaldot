[package]
name = "rwa_token"
version = "0.1.0"
authors = ["PortalRWA Team"]
edition = "2021"

[lib]
name = "rwa_token"
path = "src/lib.rs"

# ink! requires this — tells Rust to compile as a smart contract binary
crate-type = ["cdylib"]

[features]
default = ["std"]
std = [
    "ink/std",
    "scale/std",
    "scale-info/std",
]
ink-as-dependency = []

[dependencies]
# ink! — the smart contract framework (Rust eDSL)
ink = { version = "5.1.0", default-features = false }

# scale — serialization format used by Polkadot/Substrate chains
scale       = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive"] }
scale-info  = { version = "2.11", default-features = false, features = ["derive"] }

[profile.release]
# Optimize aggressively for size — WASM contracts must be small
opt-level   = "z"
overflow-checks = true   # Panic on integer overflow — important for token math
lto         = true        # Link-time optimization
codegen-units = 1
panic       = "abort"     # Smaller binary, no unwinding
strip       = "symbols"
